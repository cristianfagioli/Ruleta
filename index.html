<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vinilo Rock - Con Ranking de Selección</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Vinilo Rock">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjogIlZpbmlsbyBSb2NrIiwgInNob3J0X25hbWUiOiAiVmluaWxvUm9jayIsICJzdGFydF91cmwiOiAiLiIsICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLCAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGQwZDBkIiwgInRoZW1lX2NvbG9yIjogIiMwZDBkMGQifQ==">

    <style>
        body {
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; min-height: 100vh; margin: 0;
            background-color: #0d0d0d; color: white; font-family: Arial, sans-serif;
            padding: 10px; box-sizing: border-box;
        }

        /* EDITOR */
        #panel-editor {
            width: 100%; max-width: 320px;
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 15px;
        }

        label { font-size: 0.8rem; color: #777; text-align: center; text-transform: uppercase; font-family: Arial, sans-serif; }

        textarea {
            width: 100%; height: 120px; background: #1a1a1a; color: #fff;
            border: 1px solid #333; border-radius: 8px; padding: 10px;
            font-size: 14px; resize: vertical; box-sizing: border-box;
            outline: none; font-family: Arial, sans-serif;
        }

        #btnActualizar {
            padding: 10px; background: #222; color: #00f2ff; border: 1px solid #00f2ff;
            cursor: pointer; border-radius: 20px; font-weight: bold; font-size: 0.8rem;
            font-family: Arial, sans-serif; transition: 0.3s;
        }

        #btnActualizar:hover { background: #00f2ff; color: #000; }

        /* RULETA */
        #contenedor-vinilo {
            position: relative; width: 340px; height: 340px;
            display: flex; align-items: center; justify-content: center;
        }

        #vinilo {
            position: absolute; width: 100%; height: 100%;
            background: repeating-radial-gradient(#222, #000 1px, #111 4px);
            border: 8px solid #000; border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); z-index: 1;
        }

        #centro-eje {
            position: relative; width: 70px; height: 70px;
            background: #e67e22; border-radius: 50%;
            z-index: 20; display: flex; align-items: center; justify-content: center;
            border: 3px solid #d35400;
        }

        #btnPlay {
            width: 55px; height: 55px; border-radius: 50%; border: none;
            background: #fff; color: #000; font-weight: bold; cursor: pointer;
            z-index: 21; font-size: 11px;
        }

        #aguja {
            position: absolute; width: 4px; height: 150px;
            background: #ff4757; bottom: 50%; left: calc(50% - 2px);
            transform-origin: bottom center;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            z-index: 15; border-radius: 10px;
        }

        #nombres-wrapper { position: absolute; width: 100%; height: 100%; z-index: 5; }

        .nombre-contenedor {
            position: absolute; width: 50%; height: 2px;
            left: 50%; top: 50%; transform-origin: left center;
            display: flex; align-items: center; justify-content: flex-end;
        }

        .nombre-texto {
            padding-right: 25px; font-size: 7px; color: #666;
            text-transform: uppercase; white-space: nowrap; font-family: Arial, sans-serif;
        }

        /* VISOR LED */
        #led-visor {
            margin-top: 15px; width: 100%; max-width: 320px; height: 50px;
            background: #000; border: 2px solid #222; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: #f1c40f; font-weight: bold;
        }

        /* RANKING */
        #contenedor-ranking {
            margin-top: 25px; width: 100%; max-width: 320px;
            background: #1a1a1a; border-radius: 10px; padding: 15px;
            box-sizing: border-box; border: 1px solid #333;
        }

        #contenedor-ranking h3 {
            margin: 0 0 10px 0; font-size: 0.9rem; color: #00f2ff;
            text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px;
        }

        #lista-ranking {
            list-style: none; padding: 0; margin: 0; font-size: 0.85rem;
        }

        .ranking-item {
            display: flex; justify-content: space-between;
            padding: 4px 0; border-bottom: 1px solid #222;
        }

        .ranking-item:last-child { border-bottom: none; }
        .ranking-count { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <div id="panel-editor">
        <label>Listado de Bandas (Arial)</label>
        <textarea id="listaBandas">Soda Stereo
The Beatles
Queen
Pink Floyd
Led Zeppelin
Divididos
Sumo
Nirvana
AC/DC
The Stones</textarea>
        <button id="btnActualizar">CARGAR LISTA</button>
    </div>

    <div id="contenedor-vinilo">
        <div id="vinilo">
            <div id="nombres-wrapper"></div>
        </div>
        <div id="centro-eje">
            <button id="btnPlay">PLAY</button>
        </div>
        <div id="aguja"></div>
    </div>

    <div id="led-visor">
        <span id="resultado">READY</span>
    </div>

    <div id="contenedor-ranking">
        <h3>RANKING DE SELECCIÓN</h3>
        <ul id="lista-ranking">
            </ul>
    </div>

    <script>
        const wrapper = document.getElementById('nombres-wrapper');
        const aguja = document.getElementById('aguja');
        const led = document.getElementById('resultado');
        const btnPlay = document.getElementById('btnPlay');
        const btnActualizar = document.getElementById('btnActualizar');
        const textarea = document.getElementById('listaBandas');
        const listaRankingUI = document.getElementById('lista-ranking');
        
        let audioCtx;
        let rotacionTotal = 0;
        let bandasActuales = [];
        let conteoSelecciones = {}; 

        function actualizarRuleta() {
            bandasActuales = textarea.value.split('\n').map(b => b.trim()).filter(b => b !== "");
            
            if (bandasActuales.length === 0) return;

            const nuevoConteo = {};
            bandasActuales.forEach(b => {
                nuevoConteo[b] = conteoSelecciones[b] || 0;
            });
            conteoSelecciones = nuevoConteo;

            wrapper.innerHTML = "";
            const total = bandasActuales.length;
            const arco = 360 / total;

            bandasActuales.forEach((banda, i) => {
                const div = document.createElement('div');
                div.className = 'nombre-contenedor';
                div.style.transform = `rotate(${i * arco - 90}deg)`;
                const span = document.createElement('span');
                span.className = 'nombre-texto';
                span.innerText = banda.substring(0, 20);
                div.appendChild(span);
                wrapper.appendChild(div);
            });
            
            actualizarRankingUI();
            led.innerText = "LISTA CARGADA";
        }

        function actualizarRankingUI() {
            const sorted = Object.entries(conteoSelecciones)
                .sort((a, b) => b[1] - a[1])
                .filter(item => item[1] > 0);

            listaRankingUI.innerHTML = sorted.length > 0 
                ? sorted.map(([name, count]) => `
                    <li class="ranking-item">
                        <span>${name}</span>
                        <span class="ranking-count">${count}</span>
                    </li>
                `).join('')
                : '<li style="text-align:center; color:#444;">Sin selecciones aún</li>';
        }

        function sonarTic() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        btnPlay.onclick = () => {
            if (bandasActuales.length === 0) return;
            btnPlay.disabled = true;
            led.innerText = "GIRANDO...";
            led.style.color = "#f1c40f";

            const total = bandasActuales.length;
            const indiceGanador = Math.floor(Math.random() * total);
            const bandaGanadora = bandasActuales[indiceGanador];
            
            const arco = 360 / total;
            const anguloDestino = indiceGanador * arco;
            const vueltas = 360 * 10; 
            const nuevaRotacion = rotacionTotal + vueltas + (anguloDestino - (rotacionTotal % 360) + 360) % 360;
            
            const inicio = rotacionTotal;
            rotacionTotal = nuevaRotacion;
            aguja.style.transform = `rotate(${rotacionTotal}deg)`;

            let ticsDados = 0;
            const start = performance.now();
            function animar(now) {
                const p = Math.min((now - start) / 5000, 1);
                const ease = 1 - Math.pow(1 - p, 3);
                const actual = inicio + ((rotacionTotal - inicio) * ease);
                if (Math.floor(actual / 10) > ticsDados) {
                    sonarTic();
                    ticsDados = Math.floor(actual / 10);
                }
                if (p < 1) requestAnimationFrame(animar);
            }
            requestAnimationFrame(animar);

            setTimeout(() => {
                led.innerText = bandaGanadora;
                led.style.color = "#00f2ff";
                conteoSelecciones[bandaGanadora]++;
                actualizarRankingUI();
                btnPlay.disabled = false;
            }, 5000);
        };

        btnActualizar.onclick = actualizarRuleta;
        actualizarRuleta();
    </script>
</body>
</html>
